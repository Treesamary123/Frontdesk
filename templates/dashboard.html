
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Frontdesk Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f3f6fb;
            font-family: Arial, sans-serif;
        }
        .navbar {
            background: #172b4d;
        }
        .navbar-brand {
            color: white;
            font-weight: bold;
        }
        .dashboard-title {
            color: #172b4d;
            font-weight: bold;
        }
        .stat-card {
            border: none;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.07);
            height: 100%;
        }
        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #172b4d;
        }
        .stat-label {
            color: #64748b;
            font-size: 15px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand">Frontdesk | Support Dashboard</span>
    <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm">Logout</a>
</nav>

<div class="container py-5">

    <h2 class="dashboard-title mb-2">Dashboard</h2>
    <p class="text-muted mb-4">Customer Support Ticket Overview</p>

    <div class="row g-4">

        <div class="col-md-4">
            <div class="stat-card bg-white">
                <div class="stat-label">Total Tickets</div>
                <div class="stat-number">{{ total_tickets }}</div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="stat-card bg-white">
                <div class="stat-label">Open Tickets</div>
                <div class="stat-number">{{ open_tickets }}</div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="stat-card bg-white">
                <div class="stat-label">In Progress</div>
                <div class="stat-number">{{ in_progress_tickets }}</div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="stat-card bg-white">
                <div class="stat-label">Waiting for Customer</div>
                <div class="stat-number">{{ waiting_tickets }}</div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="stat-card bg-white">
                <div class="stat-label">Resolved Tickets</div>
                <div class="stat-number">{{ resolved_tickets }}</div>
            </div>
        </div>

    </div>

    <div class="mt-5">
        <a href="{{ url_for('tickets') }}" class="btn btn-primary btn-lg">
            Manage Tickets
        </a>
    </div>

</div>

</body>
</html>
