
<!DOCTYPE html>
<html>
<head>
    <title>Frontdesk Login</title>
    <style>
        body {
            background: #eef2f7;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            background: white;
            padding: 35px;
            width: 330px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #ccc;
        }
        h2 { color: #183153; text-align: center; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #183153;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>FRONTDESK</h2>
        <p style="text-align:center;">Customer Support Login</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p style="color:red;">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <input type="email" name="email"
                   placeholder="Email address" required>

            <input type="password" name="password"
                   placeholder="Password" required>

            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
